name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Release Build
        run: cargo build --release

  check:
    name: Check (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check merge commits
        uses: ./.github/actions/reject-merge-commits

      # A catalog from outside, as its pull request brings it
      # (docs/localization.md).
      - name: Catalogs
        run: python3 tools/check_catalog.py app/texts/*.json

      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Run tests
        run: cargo test --verbose

      # The editor's markdown (docs/markdown.md), in the runner's Chrome.
      - name: Markdown selftest
        run: |
          page=$(find target/debug -name markdown.selftest.html | head -n 1)
          google-chrome --headless --no-sandbox --virtual-time-budget=5000 --dump-dom "file://$PWD/$page" > selftest.html
          grep '<title>markdown.js selftest: all passed</title>' selftest.html
