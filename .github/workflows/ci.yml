name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # The Google OAuth client is taken from the build (av-google/auth.rs).
  AVELOR_GOOGLE_CLIENT_ID: ${{ secrets.AVELOR_GOOGLE_CLIENT_ID }}
  AVELOR_GOOGLE_CLIENT_SECRET: ${{ secrets.AVELOR_GOOGLE_CLIENT_SECRET }}
  # With both the build has Google (the feature google-account); a pull
  # request from a fork gets none, and builds without it.
  GOOGLE_ACCOUNT: ${{ (secrets.AVELOR_GOOGLE_CLIENT_ID != '' && secrets.AVELOR_GOOGLE_CLIENT_SECRET != '') && '--features avelor/google-account' || '' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Release Build
        run: cargo build --release ${{ env.GOOGLE_ACCOUNT }}

  check:
    name: Check (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check merge commits
        uses: ./.github/actions/reject-merge-commits

      # A catalog from outside, as its pull request brings it
      # (docs/localization.md).
      - name: Catalogs
        run: python3 tools/check_catalog.py app/texts/*.json

      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.HIDE_GOOGLE }} -- -D warnings

  test:
    name: Test (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Run tests
        run: cargo test --verbose ${{ env.GOOGLE_ACCOUNT }}
