name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # The Google OAuth client is taken from the build (av-google/auth.rs).
  AVELOR_GOOGLE_CLIENT_ID: ${{ secrets.AVELOR_GOOGLE_CLIENT_ID }}
  AVELOR_GOOGLE_CLIENT_SECRET: ${{ secrets.AVELOR_GOOGLE_CLIENT_SECRET }}
  # Without them (a pull request from a fork gets none) the build hides Google.
  HIDE_GOOGLE: ${{ (secrets.AVELOR_GOOGLE_CLIENT_ID == '' || secrets.AVELOR_GOOGLE_CLIENT_SECRET == '') && '--features av-google/hide-google' || '' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Release Build
        run: cargo build --release ${{ env.HIDE_GOOGLE }}

  check:
    name: Check (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check merge commits
        uses: ./.github/actions/reject-merge-commits

      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.HIDE_GOOGLE }} -- -D warnings

  test:
    name: Test (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Run tests
        run: cargo test --verbose ${{ env.HIDE_GOOGLE }}
