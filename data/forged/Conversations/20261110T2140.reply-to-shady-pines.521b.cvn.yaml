      Dear Mrs. Petrillo,

      Thank you for your security deposit statement of November 9 for Unit 4B.

      I dispute two of the deductions:

      - $300 for six nail holes. Small nail holes from hanging pictures are normal wear and tear, which a landlord can't deduct.
      - $75 for one light bulb "including labor". The bulb costs $3.

      Please refund the remaining $375 within 14 days.

      Kind regards,
      Alexander Yahnek
