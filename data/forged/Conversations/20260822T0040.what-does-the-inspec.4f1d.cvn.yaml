      Nothing structural. 47 findings, 3 major:

      - **Water heater** (finding 4): from 1998, replace within a year.
      - **Stair railing** (finding 12): loose, fix before you move in.
      - **Kitchen supply line** (finding 19): corroded, have a plumber look at it.

      The rest are notes, like a sticky front door and a creaking third stair.
