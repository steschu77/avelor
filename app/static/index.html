<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- the page's preferences, filled in by the host (page.rs) -->
  <script type="application/json" id="prefs">{}</script>
  <script type="application/json" id="texts">{}</script>
  <!-- the CSS in cascade order (architecture.md#css); build.rs inlines it -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/areas/shell.css">
  <link rel="stylesheet" href="css/areas/sidebar.css">
  <link rel="stylesheet" href="css/areas/documents.css">
  <link rel="stylesheet" href="css/areas/panel.css">
  <link rel="stylesheet" href="css/areas/header.css">
</head>

<body>

  <div class="shell">
    <header class="topbar"></header>

    <aside class="sidebar" id="sidebar" data-t-aria-label="shell.vault_panel">
      <div class="sidebar__list">
        <div class="grip grip--end" id="sidebar-divider" data-t-aria-label="layout.resize_sidebar" tabindex="0" role="separator" aria-orientation="vertical"></div>
        <div class="pane-head">
          <button type="button" class="tool" id="vault-menu-btn" aria-haspopup="menu" data-t-title="shell.vault_menu"><svg class="icon"><use href="#i-library" /></svg></button>
          <span id="vault-name"></span>
        </div>
        <div class="sidebar__scroll">
          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.projects"></span></div>
          <a class="nav-item nav-item--compact" id="all-projects" tabindex="0" role="button">
            <svg class="icon nav-item__icon"><use href="#i-layer" /></svg>
            <span data-t="sidebar.all_projects"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <a class="nav-item nav-item--compact" id="no-project" tabindex="0" role="button" data-t-title="sidebar.no_project_title">
            <svg class="icon nav-item__icon"><use href="#i-folder" /></svg>
            <span class="nav-item__name" data-t="sidebar.no_project"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <div id="projects"></div>
        </div>

        <div class="jobs" id="jobs"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="pane-head">
        <span class="project-name" id="project-name" data-t="sidebar.all_projects"></span>
        <span class="label-filter" id="label-filter"></span>
        <button type="button" class="chip chip--action" id="label-add-btn" data-t-title="header.filter_label" data-t-aria-label="header.filter_label"
          aria-haspopup="menu" hidden>+</button>
        <span class="meta docs-count" id="doc-count"></span>
        <button type="button" class="tool lens-types" id="types-btn" data-t-title="header.types_title"><span data-t="header.types"></span><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
      </div>

      <!-- Documents (features/lenses/documents.js) -->
      <div class="stack docs-lens" id="lens-documents">
        <div class="filter-bar" id="doc-types" hidden></div>
        <div class="table docs">
          <div class="list-row table__head">
            <button class="tool table__sort" data-sort="title"><span class="label" data-t="docs.name"></span></button>
            <button class="tool table__sort docs__head-date" data-sort="date"><span class="label" data-t="docs.date"></span></button>
          </div>
          <div class="table__body" id="doc-rows"></div>
          <div class="lens-hidden" id="doc-hidden" hidden>
            <span class="note" id="doc-hidden-text"></span>
            <button type="button" class="tool label" id="doc-show-all" data-t="types.show_all"></button>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel" data-t-aria-label="shell.panel">
      <div class="grip" id="panel-divider" data-t-aria-label="layout.resize_panel" tabindex="0" role="separator" aria-orientation="vertical"></div>
      <div class="toolbar panel__toolbar">
        <button type="button" class="tool" id="doc-expand-btn" data-t-title="panel.expand"><svg class="icon"><use href="#i-panel-right-expand" /></svg></button>
        <button type="button" class="tool push" id="doc-close-btn" data-t-title="panel.close"><svg class="icon"><use href="#i-dismiss" /></svg></button>
      </div>
      <div class="panel__body"></div>
      <div class="panel__context">
        <div class="grip" id="context-divider" data-t-aria-label="layout.resize_context" tabindex="0" role="separator" aria-orientation="vertical"></div>
      </div>
    </aside>

    <footer class="statusbar"></footer>
    <div class="visually-hidden" id="statusbar-said" role="status"></div>
  </div>

  <!-- the bridge to the host, filled in by the host (page.rs) -->
  <script id="bridge"></script>
  <script type="module" src="./app.js"></script>

</body>

</html>
