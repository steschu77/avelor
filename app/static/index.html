<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- the page's preferences, filled in by the host (page.rs) -->
  <script type="application/json" id="prefs">{}</script>
  <!-- the CSS in cascade order (architecture.md#css); build.rs inlines it -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/areas/shell.css">
  <link rel="stylesheet" href="css/areas/sidebar.css">
  <link rel="stylesheet" href="css/areas/documents.css">
  <link rel="stylesheet" href="css/areas/panel.css">
  <link rel="stylesheet" href="css/areas/editor.css">
  <link rel="stylesheet" href="css/areas/workspace.css">
  <link rel="stylesheet" href="css/areas/header.css">
</head>

<body>

  <template id="editor-toolbar-template">
    <div class="toolbar editor-toolbar" hidden>
      <button type="button" class="tool" data-cmd="bold" title="Bold (Ctrl+B)"><svg class="icon"><use href="#i-text-bold" /></svg></button>
      <button type="button" class="tool" data-cmd="italic" title="Italic (Ctrl+I)"><svg class="icon"><use href="#i-text-italic" /></svg></button>
      <button type="button" class="tool" data-cmd="strike" title="Strikethrough (Ctrl+Shift+X)"><svg class="icon"><use href="#i-text-strikethrough" /></svg></button>
      <button type="button" class="tool" data-cmd="code" title="Inline code (Ctrl+E)">&lt;/&gt;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-block="H1" title="Heading 1">H1</button>
      <button type="button" class="tool" data-block="H2" title="Heading 2">H2</button>
      <button type="button" class="tool" data-block="H3" title="Heading 3">H3</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="ul" title="Bullet list (Ctrl+Shift+8)"><svg class="icon"><use href="#i-text-bullet-list-ltr" /></svg></button>
      <button type="button" class="tool" data-cmd="ol" title="Numbered list (Ctrl+Shift+7)">1.</button>
      <button type="button" class="tool" data-cmd="quote" title="Quote (Ctrl+Shift+9)">&ldquo;&rdquo;</button>
      <button type="button" class="tool" data-cmd="codeblock" title="Code block">```</button>
      <button type="button" class="tool" data-cmd="hr" title="Horizontal rule">&mdash;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="link" title="Link (Ctrl+K)"><svg class="icon"><use href="#i-link" /></svg></button>
      <button type="button" class="tool" data-cmd="image" title="Image"><svg class="icon"><use href="#i-image" /></svg></button>
      <button type="button" class="tool" data-cmd="table" title="Insert table">Table</button>
      <span class="toolbar__sep" data-table-only hidden></span>
      <button type="button" class="tool" data-cmd="row-add" data-table-only hidden
        title="Add row below (Tab in the last cell)">+ Row</button>
      <button type="button" class="tool" data-cmd="row-del" data-table-only hidden title="Delete row">&minus;
        Row</button>
      <button type="button" class="tool" data-cmd="col-add" data-table-only hidden title="Add column right">+
        Col</button>
      <button type="button" class="tool" data-cmd="col-del" data-table-only hidden title="Delete column">&minus;
        Col</button>
      <button type="button" class="tool" data-cmd="table-del" data-table-only hidden title="Delete table">&times;
        Table</button>
    </div>
  </template>

  <template id="preview-toolbar-template">
    <div class="pane-section pane-section--ruled toolbar">
      <button type="button" class="tool" data-cmd="edit" title="Edit document"><svg class="icon"><use href="#i-edit" /></svg></button>
      <button type="button" class="tool tool--danger push" data-cmd="thread"
        title="Remove from thread"><svg class="icon"><use href="#i-arrow-step-in-left" /></svg></button>
      <button type="button" class="tool tool--danger" data-cmd="delete" title="Delete document"><svg class="icon"><use href="#i-delete" /></svg></button>
    </div>
  </template>

  <div class="shell">
    <header class="topbar"></header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__list">
        <div class="grip grip--end" id="sidebar-divider"></div>
        <div class="pane-head">
          <button type="button" class="tool" id="vault-menu-btn"><svg class="icon"><use href="#i-library" /></svg></button>
          <span id="vault-name"></span>
        </div>
        <div class="sidebar__scroll">
          <div class="nav-section label"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg>Projects
            <button type="button" id="add-project-btn" class="nav-section__add"
              title="Add project"><svg class="icon"><use href="#i-add" /></svg></button>
          </div>
          <a class="nav-item nav-item--compact" id="all-projects">
            <svg class="icon nav-item__icon"><use href="#i-layer" /></svg>
            All Projects
            <span id="all-documents-count" class="meta nav-item__count"></span>
          </a>
          <a class="nav-item nav-item--compact" id="no-project" title="Documents without a project">
            <svg class="icon nav-item__icon"><use href="#i-folder" /></svg>
            <span class="nav-item__name">No project</span>
            <span class="meta nav-item__count"></span>
          </a>
          <div id="projects"></div>

          <div class="nav-section label"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg>Workspace</div>
          <a class="nav-item nav-item--compact" data-vault-op="trash"><svg class="icon"><use href="#i-delete" /></svg>Trash</a>
        </div>

        <div class="jobs" id="jobs"></div>
      </div>
      <div class="sidebar__area" id="vault-area">
        <div class="pane-head">
          <span id="vault-area-title"></span>
          <button type="button" class="tool push" id="vault-area-close-btn"><svg class="icon"><use href="#i-dismiss" /></svg></button>
        </div>
        <div class="sidebar__area-body" id="vault-area-body"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="pane-head">
        <button type="button" class="tool" id="project-fold-btn" aria-expanded="false"
          title="Show project details" hidden><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
        <span class="project-name" id="project-name">All Projects</span>
        <span class="label-filter" id="label-filter"></span>
        <button type="button" class="chip chip--action" id="label-add-btn" title="Filter by a label"
          aria-haspopup="menu" hidden>+</button>
        <span class="meta docs-count" id="doc-count"></span>
        <button type="button" class="tool lens-types" id="types-btn" title="Show or hide the types"><span>Types</span><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
      </div>
      <div class="toolbar project-tools" id="project-tools" hidden>
        <button type="button" class="tool" id="project-rename-btn" title="Rename project"><svg class="icon"><use href="#i-rename" /></svg></button>
        <button type="button" class="tool" id="project-desc-btn" title="Edit description"><svg class="icon"><use href="#i-edit" /></svg></button>
        <button type="button" class="tool" id="project-archive-btn" title="Archive project"><svg class="icon"><use href="#i-archive" /></svg></button>
        <button type="button" class="tool tool--danger push" id="project-delete-btn"
          title="Delete project"><svg class="icon"><use href="#i-delete" /></svg></button>
      </div>
      <div class="project-desc editor prose" id="project-desc"></div>

      <!-- Documents (features/lenses/documents.js) -->
      <div class="stack docs-lens" id="lens-documents">
        <div class="filter-bar" id="doc-types" hidden></div>
        <div class="table docs">
          <div class="list-row table__head">
            <button class="tool table__sort" data-sort="title"><span class="label">Name</span></button>
            <button class="tool table__sort docs__head-date" data-sort="date"><span class="label">Date</span></button>
          </div>
          <div class="table__body" id="doc-rows"></div>
          <div class="lens-hidden" id="doc-hidden" hidden>
            <span class="note" id="doc-hidden-text"></span>
            <button type="button" class="tool label" id="doc-show-all">Show all types</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="grip" id="panel-divider"></div>
      <div class="toolbar panel__toolbar">
        <button type="button" class="tool" id="doc-expand-btn"><svg class="icon"><use href="#i-panel-right-expand" /></svg></button>
        <button type="button" class="tool push" id="doc-close-btn"><svg class="icon"><use href="#i-dismiss" /></svg></button>
      </div>
      <div class="panel__body" id="panel-body">
        <!-- Document View -->
        <div class="stack" id="panel-doc-view">
          <div id="doc-content" class="msg-list"></div>
        </div>
        <!-- Thread View -->
        <div class="stack" id="panel-thread-view" hidden>
          <div class="pane-section pane-section--ruled props">
            <dt class="label">Project</dt>
            <dd id="thread-project"></dd>
          </div>
          <div id="panel-thread-head" class="pane-section pane-section--ruled doc-head doc-head--thread">
            <div class="doc-head__title">
              <svg class="icon" id="thread-icon"><use /></svg>
              <span class="doc-title" id="thread-title"></span>
              <button type="button" class="icon-btn icon-btn--quiet doc-head__rename"
                id="thread-rename-btn" title="Rename thread" hidden><svg class="icon"><use href="#i-edit" /></svg></button>
            </div>
            <div class="doc-head__sub">
              <span class="meta truncate-start" id="thread-path"></span>
            </div>
          </div>
          <div id="thread-messages" class="msg-list msg-list--thread"></div>
        </div>
      </div>
      <div class="panel__context">
        <div class="grip" id="context-divider"></div>
      </div>
    </aside>

    <footer class="statusbar" role="status"></footer>
  </div>

  <!-- A file changed outside the app (features/conflict.js, saving.md#the-dialog). -->
  <dialog id="conflict-dialog" class="dialog" role="alertdialog" tabindex="-1" aria-labelledby="conflict-title"
    aria-describedby="conflict-text">
    <div class="dialog__head">
      <div class="doc-head__kind label">
        <svg class="icon" id="conflict-icon"><use href="" /></svg>
        <span class="doc-head__kind-name" id="conflict-kind"></span>
      </div>
      <div class="doc-head__title"><span class="doc-title" id="conflict-title"></span></div>
      <div class="doc-head__sub"><span class="meta truncate-start" id="conflict-path"></span></div>
    </div>
    <div class="dialog__body">
      <p class="prose" id="conflict-text"></p>
    </div>
    <div class="dialog__foot">
      <button type="button" class="btn push" id="conflict-theirs">Use theirs</button>
      <button type="button" class="btn" id="conflict-ours">Use ours</button>
    </div>
  </dialog>

  <!-- the bridge to the host, filled in by the host (page.rs) -->
  <script id="bridge"></script>
  <script type="module" src="./app.js"></script>

</body>

</html>
