<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- the page's preferences and the shipped blueprints, filled in by the
       host (page.rs) -->
  <script type="application/json" id="prefs">{}</script>
  <script type="application/json" id="blueprints">[]</script>
  <script type="application/json" id="texts">{}</script>
  <!-- the CSS in cascade order (architecture.md#css); build.rs inlines it -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/areas/shell.css">
  <link rel="stylesheet" href="css/areas/sidebar.css">
  <link rel="stylesheet" href="css/areas/dashboard.css">
  <link rel="stylesheet" href="css/areas/documents.css">
  <link rel="stylesheet" href="css/areas/timeline.css">
  <link rel="stylesheet" href="css/areas/calendar.css">
  <link rel="stylesheet" href="css/areas/bank.css">
  <link rel="stylesheet" href="css/areas/panel.css">
  <link rel="stylesheet" href="css/areas/editor.css">
  <link rel="stylesheet" href="css/areas/assistant.css">
  <link rel="stylesheet" href="css/areas/workspace.css">
  <link rel="stylesheet" href="css/areas/import.css">
  <link rel="stylesheet" href="css/areas/header.css">
  <link rel="stylesheet" href="css/areas/palette.css">
</head>

<body>

  <template id="editor-toolbar-template">
    <div class="toolbar editor-toolbar" hidden>
      <button type="button" class="tool" data-cmd="bold" data-t-title="editor.bold"><svg class="icon"><use href="#i-text-bold" /></svg></button>
      <button type="button" class="tool" data-cmd="italic" data-t-title="editor.italic"><svg class="icon"><use href="#i-text-italic" /></svg></button>
      <button type="button" class="tool" data-cmd="strike" data-t-title="editor.strike"><svg class="icon"><use href="#i-text-strikethrough" /></svg></button>
      <button type="button" class="tool" data-cmd="code" data-t-title="editor.code" data-t-aria-label="editor.code">&lt;/&gt;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-block="H1" data-t-title="editor.h1">H1</button>
      <button type="button" class="tool" data-block="H2" data-t-title="editor.h2">H2</button>
      <button type="button" class="tool" data-block="H3" data-t-title="editor.h3">H3</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="ul" data-t-title="editor.ul"><svg class="icon"><use href="#i-text-bullet-list-ltr" /></svg></button>
      <button type="button" class="tool" data-cmd="ol" data-t-title="editor.ol" data-t-aria-label="editor.ol">1.</button>
      <button type="button" class="tool" data-cmd="quote" data-t-title="editor.quote" data-t-aria-label="editor.quote">&ldquo;&rdquo;</button>
      <button type="button" class="tool" data-cmd="codeblock" data-t-title="editor.codeblock" data-t-aria-label="editor.codeblock">```</button>
      <button type="button" class="tool" data-cmd="hr" data-t-title="editor.hr" data-t-aria-label="editor.hr">&mdash;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="link" data-t-title="editor.link"><svg class="icon"><use href="#i-link" /></svg></button>
      <button type="button" class="tool" data-cmd="image" data-t-title="editor.image"><svg class="icon"><use href="#i-image" /></svg></button>
      <button type="button" class="tool" data-cmd="table" data-t-title="editor.table" data-t="editor.table_label"></button>
      <span class="toolbar__sep" data-table-only hidden></span>
      <button type="button" class="tool" data-cmd="row-add" data-table-only hidden
        data-t-title="editor.row_add" data-t="editor.row_add_label"></button>
      <button type="button" class="tool" data-cmd="row-del" data-table-only hidden data-t-title="editor.row_del" data-t="editor.row_del_label"></button>
      <button type="button" class="tool" data-cmd="col-add" data-table-only hidden data-t-title="editor.col_add" data-t="editor.col_add_label"></button>
      <button type="button" class="tool" data-cmd="col-del" data-table-only hidden data-t-title="editor.col_del" data-t="editor.col_del_label"></button>
      <button type="button" class="tool" data-cmd="table-del" data-table-only hidden data-t-title="editor.table_del" data-t="editor.table_del_label"></button>
    </div>
  </template>

  <template id="preview-toolbar-template">
    <div class="pane-section pane-section--ruled toolbar">
      <button type="button" class="tool" data-cmd="edit" data-t-title="card.edit"><svg class="icon"><use href="#i-edit" /></svg></button>
      <button type="button" class="tool" data-cmd="link" data-t-title="card.link"><svg class="icon"><use href="#i-link" /></svg></button>
      <button type="button" class="tool" data-cmd="chat" data-t-title="card.chat"><svg class="icon"><use href="#i-chat" /></svg></button>
      <button type="button" class="tool" data-cmd="task" data-t-title="card.task"><svg class="icon"><use href="#i-clipboard-task" /></svg></button>
      <button type="button" class="tool tool--danger push" data-cmd="thread"
        data-t-title="card.leave_thread"><svg class="icon"><use href="#i-arrow-step-in-left" /></svg></button>
      <button type="button" class="tool tool--danger" data-cmd="delete" data-t-title="card.delete"><svg class="icon"><use href="#i-delete" /></svg></button>
    </div>
  </template>

  <div class="shell">
    <header class="topbar">
      <nav class="tabs" data-t-aria-label="shell.lenses">
        <button type="button" data-lens="dashboard" aria-selected="true" data-t="lens.dashboard"></button>
        <button type="button" data-lens="documents" aria-selected="false" data-t="lens.documents"></button>
        <button type="button" data-lens="timeline" aria-selected="false" data-t="lens.timeline"></button>
        <button type="button" data-lens="calendar" aria-selected="false" data-t="lens.calendar"></button>
        <button type="button" data-lens="bank" aria-selected="false" data-t="lens.bank"></button>
      </nav>
    </header>

    <aside class="sidebar" id="sidebar" data-t-aria-label="shell.vault_panel">
      <div class="sidebar__list">
        <div class="grip grip--end" id="sidebar-divider" data-t-aria-label="layout.resize_sidebar" tabindex="0" role="separator" aria-orientation="vertical"></div>
        <div class="pane-head">
          <button type="button" class="tool" id="vault-menu-btn" aria-haspopup="menu" data-t-title="shell.vault_menu"><svg class="icon"><use href="#i-library" /></svg></button>
          <span id="vault-name"></span>
        </div>
        <div class="sidebar__scroll">
          <!-- Filter by words (features/words.js) -->
          <label class="search" id="words-box">
            <svg class="icon"><use href="#i-search" /></svg>
            <input class="search__input" id="words-input" data-t-placeholder="words.placeholder" data-t-aria-label="words.placeholder"
              autocomplete="off" spellcheck="false">
            <button type="button" class="search__clear" id="words-clear" data-t-title="words.clear"><svg class="icon"><use href="#i-dismiss" /></svg></button>
            <kbd data-shortcut="words.focus"></kbd>
          </label>
          <a class="nav-item nav-item--compact" id="new-item" tabindex="0" role="button" data-vault-op="new" data-action="new"
            aria-haspopup="menu">
            <svg class="icon"><use href="#i-add" /></svg>
            <span data-t="sidebar.new"></span><kbd data-shortcut="new"></kbd>
          </a>
          <!-- Go to (features/palette.js) -->
          <a class="nav-item nav-item--compact" id="goto-item" tabindex="0" role="button" aria-haspopup="dialog" data-t-title="palette.title">
            <svg class="icon"><use href="#i-arrow-right" /></svg>
            <span data-t="palette.name"></span><kbd data-shortcut="palette"></kbd>
          </a>

          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.projects"></span>
            <button type="button" id="add-project-btn" class="nav-section__add"
              data-t-title="sidebar.new_project"><svg class="icon"><use href="#i-add" /></svg></button>
          </div>
          <a class="nav-item nav-item--compact" id="all-projects" tabindex="0" role="button">
            <svg class="icon nav-item__icon"><use href="#i-layer" /></svg>
            <span data-t="sidebar.all_projects"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <a class="nav-item nav-item--compact" id="no-project" tabindex="0" role="button" data-t-title="sidebar.no_project_title">
            <svg class="icon nav-item__icon"><use href="#i-folder" /></svg>
            <span class="nav-item__name" data-t="sidebar.no_project"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <div id="projects"></div>

          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.sources"></span></div>
          <a class="nav-item nav-item--compact" id="all-sources" tabindex="0" role="button">
            <svg class="icon nav-item__icon"><use href="#i-arrow-import" /></svg>
            <span data-t="sidebar.all_sources"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <div id="sources"></div>

          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.workspace"></span></div>
          <a class="nav-item nav-item--compact" tabindex="0" role="button" data-vault-op="accounts" data-t-data-also="workspace.accounts_also"><svg class="icon"><use href="#i-cloud" /></svg><span data-t="workspace.accounts"></span></a>
          <a class="nav-item nav-item--compact" tabindex="0" role="button" data-vault-op="folders" data-t-data-also="workspace.folders_also"><svg class="icon"><use href="#i-folder" /></svg><span data-t="workspace.folders"></span></a>
          <a class="nav-item nav-item--compact" tabindex="0" role="button" data-vault-op="vault" data-t-data-also="workspace.vault_also"><svg class="icon"><use href="#i-pin" /></svg><span data-t="workspace.vault"></span></a>
          <a class="nav-item nav-item--compact" tabindex="0" role="button" data-vault-op="trash" data-t-data-also="workspace.trash_also"><svg class="icon"><use href="#i-delete" /></svg><span data-t="workspace.trash"></span></a>
        </div>

        <div class="sidebar__foot">
          <a class="nav-item nav-item--compact" id="help-item" tabindex="0" role="button" aria-haspopup="menu"><svg class="icon"><use href="#i-settings" /></svg><span data-t="settings.help"></span></a>
        </div>
        <div class="jobs" id="jobs"></div>
      </div>
      <div class="sidebar__area" id="vault-area">
        <div class="pane-head">
          <span id="vault-area-title"></span>
          <button type="button" class="tool push" id="vault-area-close-btn" data-t-title="page.close"><svg class="icon"><use href="#i-dismiss" /></svg></button>
        </div>
        <div class="sidebar__area-body" id="vault-area-body"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="pane-head">
        <button type="button" class="tool" id="project-fold-btn" aria-expanded="false"
          data-t-title="header.show_details" hidden><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
        <span class="project-name" id="project-name" data-t="sidebar.all_projects"></span>
        <span class="label-filter" id="label-filter"></span>
        <button type="button" class="chip chip--action" id="label-add-btn" data-t-title="header.filter_label" data-t-aria-label="header.filter_label"
          aria-haspopup="menu" hidden>+</button>
        <button type="button" class="tool label" id="clear-filters-btn" hidden data-t="header.clear_filters"></button>
        <span class="meta docs-count" id="doc-count" hidden></span>
        <span class="meta docs-count" id="bank-count" hidden></span>
        <button type="button" class="tool lens-types" id="types-btn" data-t-title="header.types_title"
          hidden><span data-t="header.types"></span><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
        <span class="meta" id="dash-today" hidden></span>
        <button type="button" class="tool dash__cards" id="dash-cards-btn" data-t-title="header.cards_title"
          aria-haspopup="menu" hidden><span data-t="header.cards"></span><span class="meta" id="dash-cards-closed"
            hidden></span><svg class="icon"><use href="#i-chevron-down" /></svg></button>
      </div>
      <div class="toolbar project-tools" id="project-tools" hidden>
        <button type="button" class="tool" id="project-rename-btn" data-t-title="header.rename"><svg class="icon"><use href="#i-rename" /></svg></button>
        <button type="button" class="tool" id="project-desc-btn" data-t-title="header.edit_description"><svg class="icon"><use href="#i-edit" /></svg></button>
        <button type="button" class="tool" id="project-archive-btn" data-t-title="header.archive"><svg class="icon"><use href="#i-archive" /></svg></button>
        <button type="button" class="tool tool--danger push" id="project-delete-btn"
          data-t-title="header.delete"><svg class="icon"><use href="#i-delete" /></svg></button>
      </div>
      <!-- the project's own labels and link (features/header.js) -->
      <div class="project-props" id="project-props" hidden></div>
      <div class="project-desc editor prose" id="project-desc"></div>

      <!-- Dashboard (features/dashboard/dashboard.js) -->
      <div class="dash" id="lens-dashboard">
        <div class="dash__empty" id="dash-empty" hidden>
          <p class="note" data-t="dash.all_closed"></p>
          <button type="button" class="btn" id="dash-show-all" data-t="dash.show_all"></button>
        </div>
        <div class="dash__grid" id="dash-grid"></div>
      </div>

      <!-- Documents (features/lenses/documents.js) -->
      <div class="stack docs-lens" id="lens-documents" hidden>
        <div class="filter-bar" id="doc-types" hidden></div>
        <div class="table docs">
          <div class="list-row table__head">
            <button class="tool table__sort" data-sort="title"><span class="label" data-t="docs.name"></span></button>
            <button class="tool table__sort docs__head-date" data-sort="date"><span class="label" data-t="docs.date"></span></button>
          </div>
          <div class="table__body" id="doc-rows"></div>
          <div class="lens-hidden" id="doc-hidden" hidden>
            <span class="note" id="doc-hidden-text"></span>
            <button type="button" class="tool label" id="doc-show-all" data-t="types.show_all"></button>
          </div>
        </div>
      </div>

      <!-- Timeline (features/lenses/timeline.js) -->
      <div class="stack tl-lens" id="lens-timeline" hidden>
        <div class="filter-bar" id="tl-types" hidden></div>
        <div class="tl" id="tl-feed">
          <div class="lens-hidden" id="tl-hidden" hidden>
            <span class="note" id="tl-hidden-text"></span>
            <button type="button" class="tool label" id="tl-show-all" data-t="types.show_all"></button>
          </div>
        </div>
      </div>

      <!-- Calendar View -->
      <div class="stack" id="lens-calendar" hidden>
        <div class="stack">
          <div class="cal__nav">
            <button type="button" class="icon-btn icon-btn--square" id="cal-prev" data-t-title="cal.previous_month"><svg class="icon"><use href="#i-chevron-left" /></svg></button>
            <button type="button" class="icon-btn icon-btn--square" id="cal-next" data-t-title="cal.next_month"><svg class="icon"><use href="#i-chevron-right" /></svg></button>
            <span class="doc-title" id="cal-title"></span>
            <button type="button" class="tool" id="cal-today" data-t="cal.today"></button>
          </div>
          <div class="cal__week cal__head label" id="calendar-headrow"></div>
          <div class="cal__weeks" id="calendar-weeks"></div>
        </div>
      </div>

      <!-- Bank (features/lenses/bank.js) -->
      <div class="stack bank-lens" id="lens-bank" hidden></div>

    </main>

    <aside class="panel" id="panel" data-t-aria-label="shell.panel">
      <div class="grip" id="panel-divider" data-t-aria-label="layout.resize_panel" tabindex="0" role="separator" aria-orientation="vertical"></div>
      <div class="toolbar panel__toolbar">
        <button type="button" class="tool" id="doc-expand-btn" data-t-title="panel.expand"><svg class="icon"><use href="#i-panel-right-expand" /></svg></button>
        <button type="button" class="tool push" id="doc-close-btn" data-t-title="panel.close"><svg class="icon"><use href="#i-dismiss" /></svg></button>
      </div>
      <div class="panel__body" id="panel-body">
        <!-- The find strip (features/panel/find.js) -->
        <div class="find" id="find" hidden>
          <svg class="icon"><use href="#i-search" /></svg>
          <span class="find__q" id="find-q"></span>
          <span class="meta find__n" id="find-n"></span>
          <button type="button" class="tool" id="find-prev" data-t-title="find.prev"><svg class="icon"><use href="#i-chevron-up" /></svg></button>
          <button type="button" class="tool" id="find-next" data-t-title="find.next"><svg class="icon"><use href="#i-chevron-down" /></svg></button>
        </div>
        <!-- Document View -->
        <div class="stack" id="panel-doc-view">
          <div id="doc-content" class="msg-list"></div>
        </div>
        <!-- Thread View -->
        <div class="stack" id="panel-thread-view" hidden>
          <div class="pane-section pane-section--ruled props">
            <dt class="label" data-t="thread.project"></dt>
            <dd id="thread-project"></dd>
          </div>
          <div id="panel-thread-head" class="pane-section pane-section--ruled doc-head doc-head--thread">
            <div class="doc-head__title">
              <svg class="icon" id="thread-icon"><use /></svg>
              <span class="doc-title" id="thread-title"></span>
              <button type="button" class="icon-btn icon-btn--quiet doc-head__rename"
                id="thread-rename-btn" data-t-title="thread.rename" hidden><svg class="icon"><use href="#i-edit" /></svg></button>
            </div>
            <div class="doc-head__sub">
              <span class="meta truncate-start" id="thread-path"></span>
            </div>
          </div>
          <div id="thread-messages" class="msg-list msg-list--thread"></div>
        </div>
        <!-- Day View: the selected day's events as cards (features/panel/panel.js) -->
        <div class="stack" id="panel-day-view" hidden>
          <div class="pane-section pane-section--ruled doc-head doc-head--thread">
            <div class="doc-head__sub label" id="day-weekday"></div>
            <div class="doc-head__title doc-title" id="day-title"></div>
            <div class="doc-head__sub">
              <button type="button" class="tool label" id="day-new-event" data-t-title="day.new_event_title"><svg
                  class="icon"><use href="#i-add" /></svg><span data-t="day.new_event"></span></button>
            </div>
          </div>
          <div id="day-cards" class="msg-list msg-list--day"></div>
        </div>
        <!-- Transaction View: a transaction of a statement as a card (features/panel/transaction.js) -->
        <div class="stack" id="panel-transaction-view" hidden>
          <div class="msg-list" id="transaction-card"></div>
        </div>
      </div>
      <div class="panel__context">
        <div class="grip" id="context-divider" data-t-aria-label="layout.resize_context" tabindex="0" role="separator" aria-orientation="vertical"></div>
        <!-- Tabs about what the panel shows (context.js) -->
        <div class="context">
          <nav class="tabs context__tabs" id="context-tabs" role="tablist"></nav>
          <!-- Assistant (features/assistant/assistant.js) -->
          <div id="assistant" class="chat">
            <div class="chat__head">
              <div class="chat__bar label">
                <svg class="chat__spark" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linejoin="round">
                  <path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path>
                </svg>
                <button type="button" class="tool ai-pick" id="assistant-model"></button>
                <button type="button" class="tool chat__switch" id="assistant-switch"
                  data-t-title="assistant.switch_title"><span data-t="assistant.new"></span> &#x2304;</button>
              </div>
              <div class="subtitle" id="assistant-title" hidden></div>
            </div>
            <div class="chat__messages" id="assistant-messages"></div>
            <div class="chat__compose">
              <div class="editor prose chat__input" id="assistant-input" data-t-data-placeholder="assistant.placeholder"></div>
              <button type="button" class="chat__send" id="assistant-send" data-t-title="assistant.send"
                disabled><svg class="icon"><use href="#i-send" /></svg></button>
            </div>
          </div>
          <!-- A new task for what is shown (features/new.js) -->
          <div id="context-task" class="context__pane" hidden></div>
          <!-- The links of what is shown (features/linked.js) -->
          <div id="context-linked" class="context__pane" hidden></div>
        </div>
      </div>
    </aside>

    <footer class="statusbar"></footer>
    <div class="visually-hidden" id="statusbar-said" role="status"></div>
  </div>

  <!-- Go to: places, commands and keys by name (features/palette.js). -->
  <dialog id="palette" class="dialog palette" data-t-aria-label="palette.name">
    <div class="palette__box">
      <svg class="icon"><use href="#i-arrow-right" /></svg>
      <input class="palette__input" id="palette-input" role="combobox" aria-expanded="true" aria-controls="palette-list"
        aria-autocomplete="list" autocomplete="off" spellcheck="false" data-t-aria-label="palette.title">
      <span class="seg palette__narrow" id="palette-narrow" role="group" data-t-aria-label="palette.narrow">
        <button type="button" data-narrow="" tabindex="-1" data-t="palette.all"></button>
        <button type="button" data-narrow="&gt;" tabindex="-1"><span data-t="palette.commands"></span><kbd>&gt;</kbd></button>
        <button type="button" data-narrow="keys" tabindex="-1" data-t="palette.keys"></button>
      </span>
    </div>
    <div class="palette__list" id="palette-list" role="listbox" data-t-aria-label="palette.found"></div>
    <div class="palette__foot label" id="palette-foot"></div>
  </dialog>

  <!-- A file changed outside the app (features/conflict.js, saving.md#the-dialog). -->
  <dialog id="conflict-dialog" class="dialog" role="alertdialog" tabindex="-1" aria-labelledby="conflict-title"
    aria-describedby="conflict-text">
    <div class="dialog__head">
      <div class="doc-head__kind label">
        <svg class="icon" id="conflict-icon"><use href="" /></svg>
        <span class="doc-head__kind-name" id="conflict-kind"></span>
      </div>
      <div class="doc-head__title"><span class="doc-title" id="conflict-title"></span></div>
      <div class="doc-head__sub"><span class="meta truncate-start" id="conflict-path"></span></div>
    </div>
    <div class="dialog__body">
      <p class="prose" id="conflict-text"></p>
    </div>
    <div class="dialog__foot">
      <button type="button" class="btn push" id="conflict-theirs" data-t="conflict.theirs"></button>
      <button type="button" class="btn" id="conflict-ours" data-t="conflict.ours"></button>
    </div>
  </dialog>

  <!-- the bridge to the host, filled in by the host (page.rs) -->
  <script id="bridge"></script>
  <script type="module" src="./app.js"></script>

</body>

</html>
