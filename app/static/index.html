<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- the page's preferences, filled in by the host (page.rs) -->
  <script type="application/json" id="prefs">{}</script>
  <script type="application/json" id="texts">{}</script>
  <!-- the CSS in cascade order (architecture.md#css); build.rs inlines it -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/areas/shell.css">
  <link rel="stylesheet" href="css/areas/sidebar.css">
  <link rel="stylesheet" href="css/areas/documents.css">
  <link rel="stylesheet" href="css/areas/panel.css">
  <link rel="stylesheet" href="css/areas/editor.css">
  <link rel="stylesheet" href="css/areas/workspace.css">
  <link rel="stylesheet" href="css/areas/header.css">
</head>

<body>

  <template id="editor-toolbar-template">
    <div class="toolbar editor-toolbar" hidden>
      <button type="button" class="tool" data-cmd="bold" data-t-title="editor.bold"><svg class="icon"><use href="#i-text-bold" /></svg></button>
      <button type="button" class="tool" data-cmd="italic" data-t-title="editor.italic"><svg class="icon"><use href="#i-text-italic" /></svg></button>
      <button type="button" class="tool" data-cmd="strike" data-t-title="editor.strike"><svg class="icon"><use href="#i-text-strikethrough" /></svg></button>
      <button type="button" class="tool" data-cmd="code" data-t-title="editor.code" data-t-aria-label="editor.code">&lt;/&gt;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-block="H1" data-t-title="editor.h1">H1</button>
      <button type="button" class="tool" data-block="H2" data-t-title="editor.h2">H2</button>
      <button type="button" class="tool" data-block="H3" data-t-title="editor.h3">H3</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="ul" data-t-title="editor.ul"><svg class="icon"><use href="#i-text-bullet-list-ltr" /></svg></button>
      <button type="button" class="tool" data-cmd="ol" data-t-title="editor.ol" data-t-aria-label="editor.ol">1.</button>
      <button type="button" class="tool" data-cmd="quote" data-t-title="editor.quote" data-t-aria-label="editor.quote">&ldquo;&rdquo;</button>
      <button type="button" class="tool" data-cmd="codeblock" data-t-title="editor.codeblock" data-t-aria-label="editor.codeblock">```</button>
      <button type="button" class="tool" data-cmd="hr" data-t-title="editor.hr" data-t-aria-label="editor.hr">&mdash;</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="tool" data-cmd="link" data-t-title="editor.link"><svg class="icon"><use href="#i-link" /></svg></button>
      <button type="button" class="tool" data-cmd="image" data-t-title="editor.image"><svg class="icon"><use href="#i-image" /></svg></button>
      <button type="button" class="tool" data-cmd="table" data-t-title="editor.table" data-t="editor.table_label"></button>
      <span class="toolbar__sep" data-table-only hidden></span>
      <button type="button" class="tool" data-cmd="row-add" data-table-only hidden
        data-t-title="editor.row_add" data-t="editor.row_add_label"></button>
      <button type="button" class="tool" data-cmd="row-del" data-table-only hidden data-t-title="editor.row_del" data-t="editor.row_del_label"></button>
      <button type="button" class="tool" data-cmd="col-add" data-table-only hidden data-t-title="editor.col_add" data-t="editor.col_add_label"></button>
      <button type="button" class="tool" data-cmd="col-del" data-table-only hidden data-t-title="editor.col_del" data-t="editor.col_del_label"></button>
      <button type="button" class="tool" data-cmd="table-del" data-table-only hidden data-t-title="editor.table_del" data-t="editor.table_del_label"></button>
    </div>
  </template>

  <template id="preview-toolbar-template">
    <div class="pane-section pane-section--ruled toolbar">
      <button type="button" class="tool" data-cmd="edit" data-t-title="card.edit"><svg class="icon"><use href="#i-edit" /></svg></button>
      <button type="button" class="tool tool--danger push" data-cmd="thread"
        data-t-title="card.leave_thread"><svg class="icon"><use href="#i-arrow-step-in-left" /></svg></button>
      <button type="button" class="tool tool--danger" data-cmd="delete" data-t-title="card.delete"><svg class="icon"><use href="#i-delete" /></svg></button>
    </div>
  </template>

  <div class="shell">
    <header class="topbar"></header>

    <aside class="sidebar" id="sidebar" data-t-aria-label="shell.vault_panel">
      <div class="sidebar__list">
        <div class="grip grip--end" id="sidebar-divider" data-t-aria-label="layout.resize_sidebar" tabindex="0" role="separator" aria-orientation="vertical"></div>
        <div class="pane-head">
          <button type="button" class="tool" id="vault-menu-btn" aria-haspopup="menu" data-t-title="shell.vault_menu"><svg class="icon"><use href="#i-library" /></svg></button>
          <span id="vault-name"></span>
        </div>
        <div class="sidebar__scroll">
          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.projects"></span>
            <button type="button" id="add-project-btn" class="nav-section__add"
              data-t-title="sidebar.new_project"><svg class="icon"><use href="#i-add" /></svg></button>
          </div>
          <a class="nav-item nav-item--compact" id="all-projects" tabindex="0" role="button">
            <svg class="icon nav-item__icon"><use href="#i-layer" /></svg>
            <span data-t="sidebar.all_projects"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <a class="nav-item nav-item--compact" id="no-project" tabindex="0" role="button" data-t-title="sidebar.no_project_title">
            <svg class="icon nav-item__icon"><use href="#i-folder" /></svg>
            <span class="nav-item__name" data-t="sidebar.no_project"></span>
            <span class="meta nav-item__count"></span>
          </a>
          <div id="projects"></div>

          <div class="nav-section label" tabindex="0" role="button"><svg class="icon disclosure"><use href="#i-chevron-down" /></svg><span data-t="sidebar.workspace"></span></div>
          <a class="nav-item nav-item--compact" tabindex="0" role="button" data-vault-op="trash"><svg class="icon"><use href="#i-delete" /></svg><span data-t="workspace.trash"></span></a>
        </div>

        <div class="jobs" id="jobs"></div>
      </div>
      <div class="sidebar__area" id="vault-area">
        <div class="pane-head">
          <span id="vault-area-title"></span>
          <button type="button" class="tool push" id="vault-area-close-btn"><svg class="icon"><use href="#i-dismiss" /></svg></button>
        </div>
        <div class="sidebar__area-body" id="vault-area-body"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="pane-head">
        <button type="button" class="tool" id="project-fold-btn" aria-expanded="false"
          data-t-title="header.show_details" hidden><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
        <span class="project-name" id="project-name" data-t="sidebar.all_projects"></span>
        <span class="label-filter" id="label-filter"></span>
        <button type="button" class="chip chip--action" id="label-add-btn" data-t-title="header.filter_label" data-t-aria-label="header.filter_label"
          aria-haspopup="menu" hidden>+</button>
        <span class="meta docs-count" id="doc-count"></span>
        <button type="button" class="tool lens-types" id="types-btn" data-t-title="header.types_title"><span data-t="header.types"></span><svg class="icon disclosure"><use href="#i-chevron-down" /></svg></button>
      </div>
      <div class="toolbar project-tools" id="project-tools" hidden>
        <button type="button" class="tool" id="project-rename-btn" data-t-title="header.rename"><svg class="icon"><use href="#i-rename" /></svg></button>
        <button type="button" class="tool" id="project-desc-btn" data-t-title="header.edit_description"><svg class="icon"><use href="#i-edit" /></svg></button>
        <button type="button" class="tool" id="project-archive-btn" data-t-title="header.archive"><svg class="icon"><use href="#i-archive" /></svg></button>
        <button type="button" class="tool tool--danger push" id="project-delete-btn"
          data-t-title="header.delete"><svg class="icon"><use href="#i-delete" /></svg></button>
      </div>
      <div class="project-desc editor prose" id="project-desc"></div>

      <!-- Documents (features/lenses/documents.js) -->
      <div class="stack docs-lens" id="lens-documents">
        <div class="filter-bar" id="doc-types" hidden></div>
        <div class="table docs">
          <div class="list-row table__head">
            <button class="tool table__sort" data-sort="title"><span class="label" data-t="docs.name"></span></button>
            <button class="tool table__sort docs__head-date" data-sort="date"><span class="label" data-t="docs.date"></span></button>
          </div>
          <div class="table__body" id="doc-rows"></div>
          <div class="lens-hidden" id="doc-hidden" hidden>
            <span class="note" id="doc-hidden-text"></span>
            <button type="button" class="tool label" id="doc-show-all" data-t="types.show_all"></button>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel" data-t-aria-label="shell.panel">
      <div class="grip" id="panel-divider" data-t-aria-label="layout.resize_panel" tabindex="0" role="separator" aria-orientation="vertical"></div>
      <div class="toolbar panel__toolbar">
        <button type="button" class="tool" id="doc-expand-btn" data-t-title="panel.expand"><svg class="icon"><use href="#i-panel-right-expand" /></svg></button>
        <button type="button" class="tool push" id="doc-close-btn" data-t-title="panel.close"><svg class="icon"><use href="#i-dismiss" /></svg></button>
      </div>
      <div class="panel__body" id="panel-body">
        <!-- Document View -->
        <div class="stack" id="panel-doc-view">
          <div id="doc-content" class="msg-list"></div>
        </div>
        <!-- Thread View -->
        <div class="stack" id="panel-thread-view" hidden>
          <div class="pane-section pane-section--ruled props">
            <dt class="label" data-t="thread.project"></dt>
            <dd id="thread-project"></dd>
          </div>
          <div id="panel-thread-head" class="pane-section pane-section--ruled doc-head doc-head--thread">
            <div class="doc-head__title">
              <svg class="icon" id="thread-icon"><use /></svg>
              <span class="doc-title" id="thread-title"></span>
              <button type="button" class="icon-btn icon-btn--quiet doc-head__rename"
                id="thread-rename-btn" data-t-title="thread.rename" hidden><svg class="icon"><use href="#i-edit" /></svg></button>
            </div>
            <div class="doc-head__sub">
              <span class="meta truncate-start" id="thread-path"></span>
            </div>
          </div>
          <div id="thread-messages" class="msg-list msg-list--thread"></div>
        </div>
      </div>
      <div class="panel__context">
        <div class="grip" id="context-divider" data-t-aria-label="layout.resize_context" tabindex="0" role="separator" aria-orientation="vertical"></div>
      </div>
    </aside>

    <footer class="statusbar"></footer>
    <div class="visually-hidden" id="statusbar-said" role="status"></div>
  </div>

  <!-- A file changed outside the app (features/conflict.js, saving.md#the-dialog). -->
  <dialog id="conflict-dialog" class="dialog" role="alertdialog" tabindex="-1" aria-labelledby="conflict-title"
    aria-describedby="conflict-text">
    <div class="dialog__head">
      <div class="doc-head__kind label">
        <svg class="icon" id="conflict-icon"><use href="" /></svg>
        <span class="doc-head__kind-name" id="conflict-kind"></span>
      </div>
      <div class="doc-head__title"><span class="doc-title" id="conflict-title"></span></div>
      <div class="doc-head__sub"><span class="meta truncate-start" id="conflict-path"></span></div>
    </div>
    <div class="dialog__body">
      <p class="prose" id="conflict-text"></p>
    </div>
    <div class="dialog__foot">
      <button type="button" class="btn push" id="conflict-theirs" data-t="conflict.theirs"></button>
      <button type="button" class="btn" id="conflict-ours" data-t="conflict.ours"></button>
    </div>
  </dialog>

  <!-- the bridge to the host, filled in by the host (page.rs) -->
  <script id="bridge"></script>
  <script type="module" src="./app.js"></script>

</body>

</html>
