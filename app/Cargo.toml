[package]
name = "avelor"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { workspace = true }
av-utils = { path = "../crates/av-utils" }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = { workspace = true, features = ["v2_72"] }
glib-unix = { workspace = true }
gtk = { workspace = true, features = ["v4_10"] }
libc = { workspace = true }

[build-dependencies]
embed-resource = "3.0"
static_vcruntime = "3.0"

[lints]
workspace = true
