[package]
name = "avelor"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { workspace = true }
av-google = { path = "../crates/av-google" }
av-llm = { path = "../crates/av-llm" }
av-utils = { path = "../crates/av-utils" }
av-vault = { path = "../crates/av-vault" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[features]
hide-google = ["av-google/hide-google"]

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = { workspace = true, features = ["v2_72"] }
glib-unix = { workspace = true }
gtk = { workspace = true, features = ["v4_10"] }
libc = { workspace = true }
webkit6 = { workspace = true }

[build-dependencies]
embed-resource = "3.0"
oxc = { workspace = true, features = ["minifier", "codegen"] }
av-bundle = { path = "../crates/av-bundle" }
static_vcruntime = "3.0"

[lints]
workspace = true
