[workspace]
members = ["crates/av-utils", "crates/av-http", "crates/av-vault", "crates/av-store", "crates/av-google", "crates/av-llm", "crates/av-bundle", "app"]
resolver = "3"

[workspace.dependencies]
gio = "0.22.10"
glib = "0.22.10"
glib-unix = "0.22.8"
gtk = { package = "gtk4", version = "0.11.5" }
libc = "0.2.191"
log = "0.4.34"
oxc = "0.156"
pulldown-cmark = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
soup3 = "0.9"
webkit6 = "0.6.1"
webview2-com = "0.39.1"
windows = "0.62.2"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"
excessive_precision = "allow"

[profile.release]
opt-level = "z"           # Optimize for size instead of speed
lto = true                # Enable Link Time Optimization
codegen-units = 1         # Better optimization (slower compile)
strip = true              # Strip symbols from binary
panic = "abort"           # No unwinding: a panic ends the process
